[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimax-h3-pixel-sprite-pipeline"
version = "0.1.0"
description = "A reproducible pixel-art image-to-video-to-sprite-sheet pipeline for MiniMax-H3."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Eiji M." }]
dependencies = [
  "Pillow>=10.0",
  "av>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
